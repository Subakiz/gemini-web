[project]
name = "gemini-web"
version = "0.1.0"
description = "Use the Gemini web app from a shell (ask, image) through headless Chrome"
requires-python = ">=3.10"
dependencies = ["playwright==1.61.*"]

[project.scripts]
gemini-web = "gemini_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemini_web"]
